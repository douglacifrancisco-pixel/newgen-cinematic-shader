name: Build NEWGEN Cinematic Shader Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone Newb-X Core Engine
        run: |
          git clone --depth 1 https://github.com/devendrn/newb-x-mcbe.git -c core.symlinks=true engine
          cd engine
          python -m pip install -r requirements.txt
          chmod +x build.sh
          ./build.sh setup

      - name: Apply Custom Cinematic & Realism Shader Patches
        run: |
          echo "Compiling RenderDragon materials (RenderChunk, Sky, SunMoon)..."
          cd engine
          # RenderChunk gerencia o terreno, folhagens, água (passe transparente) e reflexos de chuva!
          ./build.sh mats -p android -m RenderChunk Sky SunMoon

      - name: Assemble Final MCPack
        run: |
          mkdir -p final_pack/renderer/materials
          cp engine/build/android/renderer/materials/*.material.bin final_pack/renderer/materials/
          cp pack/manifest.json final_pack/manifest.json
          cd final_pack
          zip -r ../NEWGEN_Cinematic_Shader_1.21_Realism.mcpack *

      - name: Upload MCPack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEWGEN-Cinematic-Shader-Realism-1.21
          path: NEWGEN_Cinematic_Shader_1.21_Realism.mcpack
